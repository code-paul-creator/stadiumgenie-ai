<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="100%" height="160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e1420"/>
      <stop offset="100%" stop-color="#0b2e23"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f4f6f0" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffb81c" stop-opacity="1"/>
      <stop offset="55%" stop-color="#ffb81c" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f4f6f0" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        from="-1 0" to="1 0" dur="3.2s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="ballShade" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d9d9d9"/>
    </radialGradient>
  </defs>

  <rect width="900" height="160" fill="url(#bg)"/>
  <!-- pitch stripe -->
  <rect x="0" y="118" width="900" height="42" fill="#153c2c"/>
  <rect x="0" y="118" width="900" height="6" fill="#1e5c43"/>

  <!-- Title -->
  <text x="450" y="58" text-anchor="middle" font-family="'Big Shoulders Display','Arial Narrow',sans-serif"
        font-size="40" font-weight="800" fill="#f4f6f0" letter-spacing="1">
    STADIUM COMPANION
  </text>
  <text x="450" y="58" text-anchor="middle" font-family="'Big Shoulders Display','Arial Narrow',sans-serif"
        font-size="40" font-weight="800" fill="url(#shine)" letter-spacing="1">
    STADIUM COMPANION
  </text>

  <text x="450" y="86" text-anchor="middle" font-family="'IBM Plex Mono',monospace"
        font-size="15" fill="#9fb0a6">
    GenAI navigation · crowd watch · accessibility · sustainability — FIFA World Cup 2026
  </text>

  <!-- rolling football -->
  <g>
    <animateMotion dur="6s" repeatCount="indefinite"
      path="M -40,138 L 940,138" />
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0"
        dur="0.9s" repeatCount="indefinite"/>
      <circle r="16" fill="url(#ballShade)" stroke="#1b241f" stroke-width="1.5"/>
      <path d="M -7,-13 L 7,-13 L 11,0 L 0,10 L -11,0 Z" fill="#1b241f"/>
      <path d="M -16,0 L -11,0 M 16,0 L 11,0 M 0,-16 L 0,-13 M -7,-13 L -11,0 L 0,10 L 11,0 L 7,-13"
        fill="none" stroke="#1b241f" stroke-width="1.2"/>
    </g>
  </g>

  <!-- ball shadow that stretches/shrinks as it "moves" -->
  <ellipse cx="450" cy="150" rx="14" ry="3.5" fill="#000" opacity="0.35">
    <animateMotion dur="6s" repeatCount="indefinite" path="M -40,0 L 940,0"/>
  </ellipse>
</svg>
